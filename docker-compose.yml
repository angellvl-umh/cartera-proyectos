services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cartera_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # Persistencia en PostgreSQL (BD propia `keycloak`; ver infra/docker/initdb)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # Identity broker (sustituidos en el import del realm; ver infra/KEYCLOAK.md)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-pendiente}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-pendiente}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:-cartera-admin-secret}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/cartera-realm.json:/opt/keycloak/data/import/cartera-realm.json
      - ./infra/keycloak/themes/cartera:/opt/keycloak/themes/cartera
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=cartera_app;Username=postgres;Password=postgres"
      Auth__Authority: "http://keycloak:8080/realms/cartera"
      Auth__ValidIssuer: "http://localhost:8080/realms/cartera"
      Auth__Audience: "account"
      Cors__Origins__0: "http://localhost"
      Cors__Origins__1: "http://localhost:4200"
      Cors__Origins__2: "http://localhost:3000"
      Admin__InitialGestorEmails__0: "gestor@universidad.es"
      Agent__ApiKey: ${AGENT_API_KEY:-cartera-agent-key}
      Keycloak__BaseUrl: "http://keycloak:8080"
      Keycloak__Realm: "cartera"
      Keycloak__AdminClientId: "cartera-admin"
      Keycloak__AdminClientSecret: ${KC_ADMIN_CLIENT_SECRET:-cartera-admin-secret}
      Aws__BearerToken: ${AWS_BEARER_TOKEN_BEDROCK:-}
      Aws__AccessKeyId: ${AWS_ACCESS_KEY_ID:-}
      Aws__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-}
      Aws__SessionToken: ${AWS_SESSION_TOKEN:-}
      Aws__Region: ${AWS_REGION:-us-east-1}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    environment:
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      # LLM backend via LiteLLM
      OPENAI_API_BASE_URL: "http://litellm:4000"
      OPENAI_API_KEY: "sk-cartera-litellm-key"
      # Disable Ollama (not used)
      ENABLE_OLLAMA_API: "false"
      # Security
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-cartera-webui-secret-change-in-prod}
      # Tool Server: registrar manualmente en Admin → Settings → Tools → Add Tool Server
      # URL: http://backend:8080/openapi/agent.json  |  Auth: Bearer cartera-agent-key
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
  openwebui_data:
